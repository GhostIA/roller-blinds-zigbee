; Zigbee roller blind: Feather ESP32-C6 + TMC2209 (STEP/DIR + UART setup)
;
; The official PlatformIO espressif32 platform lags behind Arduino-ESP32 3.x,
; which Zigbee on the C6 needs, so this uses the pioarduino fork.

[platformio]
default_envs = feather_c6

[env:feather_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32c6
framework = arduino

; Partition table with the Zigbee storage partitions (end device layout).
; Ships with the Arduino-ESP32 core, no local file needed.
board_build.partitions = zigbee.csv

monitor_speed = 115200

; The Feather board definition already sets the native-USB serial flags.
build_flags =
    -DZIGBEE_MODE_ED
    -DCORE_DEBUG_LEVEL=4          ; 0 none, 1 error, 2 warn, 3 info, 4 debug, 5 verbose
    -DARDUINO_ZIGBEE_DEBUG=1      ; see note below

monitor_filters =
    esp32_exception_decoder       ; decodes addresses in crash dumps
    time                          ; timestamps on each line-Og -g3                       ; keep debug symbols, less inlining, better stack traces

lib_deps =
    waspinator/AccelStepper@^1.64
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit NeoPixel@^1.15.1

; `pio test` on the board: needs the Feather plugged in, motor power off.
test_framework = unity
test_filter = test_blind_motor
upload_port = /dev/cu.usbmodem1101
debug_port = /dev/cu.usbmodem1101
; Host-only tests for the pure math: `pio test -e native`, no board needed.
[env:native]
platform = native
test_framework = unity
test_filter = test_blind_math
build_flags = -std=gnu++17